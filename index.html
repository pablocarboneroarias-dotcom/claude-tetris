<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="theme-toggle">
      <span class="icon" aria-hidden="true">🌙</span>
      <label class="switch">
        <input type="checkbox" id="theme-switch" role="switch" aria-checked="false" aria-label="Cambiar entre modo oscuro y modo claro" />
        <span class="slider"></span>
      </label>
      <span class="icon" aria-hidden="true">☀️</span>
    </div>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>

        <div class="panel-section records">
          <span class="label">RECORDS</span>
          <ol id="highscore-list"></ol>
          <div class="records-stats">
            <span>Mejor combo: <span id="best-combo">0</span></span>
            <span>Máx. líneas: <span id="max-lines">0</span></span>
          </div>
          <button id="reset-records-btn">Reiniciar récords</button>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="name-entry" class="hidden">
          <p class="name-entry-label">¡Nuevo récord! Ingresa tu nombre:</p>
          <input type="text" id="name-input" maxlength="10" placeholder="AAA" />
          <button id="name-submit-btn">Guardar</button>
        </div>

        <div id="overlay-records" class="hidden">
          <span class="label">TOP 5</span>
          <ol id="overlay-highscore-list"></ol>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
